<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Group C — DNS, WHOIS & IP Analysis Flashcards</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--accent:#ff7b00;--bg-light:#f4f4f7;--bg-dark:#0A0E17;--text-dark:#121212;--text-light:#ffffff;--card-light:#ffffff;--card-dark:#0f0f12;}
body{margin:0;font-family:"Inter",sans-serif;background:var(--bg-light);color:var(--text-dark);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;transition:.35s;}
.theme-toggle{position:fixed;top:18px;left:22px;border:2px solid var(--accent);color:var(--accent);padding:10px 20px;border-radius:14px;background:transparent;cursor:pointer;transition:.3s;}
.group-label{position:fixed;top:18px;right:22px;font-weight:700;letter-spacing:1px;color:var(--accent);}
.card{width:85vw;max-width:950px;height:350px;background:var(--card-light);border-radius:28px;display:flex;justify-content:center;align-items:center;cursor:pointer;perspective:1400px;position:relative;overflow:hidden;box-shadow:0px 25px 60px rgba(0,0,0,0.2);}
.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.22,.61,.36,1);}
.card.flipped .inner{transform:rotateY(180deg);}
.side{position:absolute;inset:0;backface-visibility:hidden;display:flex;justify-content:center;align-items:center;padding:35px;text-align:center;font-size:clamp(18px,2.3vw,28px);line-height:1.4;transition:.25s;}
.front{transform:rotateY(0deg);}
.back{transform:rotateY(180deg);color:var(--accent);font-weight:bold;}
.card:not(.flipped) .back{opacity:0;pointer-events:none;}
.card.flipped .front{opacity:0;pointer-events:none;}
.controls{margin-top:32px;display:flex;gap:24px;justify-content:center;}
.ctrl-btn{background:transparent;border:none;font-size:28px;cursor:pointer;color:var(--accent);padding:10px 30px;border-radius:12px;transition:.25s;}
.ctrl-btn:hover{background:rgba(255,123,0,0.15);transform:scale(1.18);}
.ctrl-btn:disabled{opacity:.25;cursor:not-allowed;}
.counter{opacity:.65;font-size:14px;width:80px;text-align:center;}
body.dark{background:var(--bg-dark);color:var(--text-light);}
body.dark .card{background:var(--card-dark);color:var(--text-light);box-shadow:0px 25px 60px rgba(255,255,255,0.05);}
body.dark .back{color:var(--accent);}
body.dark .ctrl-btn{color:var(--accent);}
body.dark .ctrl-btn:hover{background:rgba(255,123,0,0.25);}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
<div class="group-label">GROUP C</div>
<div>
  <div class="card" id="card" onclick="flipCard()">
    <div class="inner">
      <div class="side front" id="front"></div>
      <div class="side back" id="back"></div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="prevCard()" id="prevBtn">⬅</button>
    <span class="counter" id="progress"></span>
    <button class="ctrl-btn" onclick="nextCard()" id="nextBtn">➡</button>
  </div>
</div>
<script>
/* Knowledge Group C — DNS, WHOIS & IP Analysis */
const flashcards = [
  { q: "What does an A record map?", a: "A hostname → an IPv4 address." },
  { q: "What does an AAAA record map?", a: "A hostname → an IPv6 address." },
  { q: "What is a CNAME record?", a: "A canonical-name alias: it points one hostname to another hostname (e.g. www.example.com → example.com)." },
  { q: "What does an MX record specify?", a: "The mail exchanger(s) (mail servers) responsible for accepting email for a domain, together with a preference value." },
  { q: "What does an NS record specify?", a: "The authoritative nameserver(s) for a zone/domain." },
  { q: "What information does the SOA record hold?", a: "Start Of Authority — primary nameserver, responsible party email, serial number, refresh/retry/expire timers, and minimum TTL for the zone." },
  { q: "What is a PTR record used for?", a: "Reverse DNS — mapping an IP address back to a hostname (lives under the in-addr.arpa / ip6.arpa zones)." },
  { q: "What is a TXT record typically used for?", a: "Arbitrary text data — commonly SPF, DKIM, DMARC, and domain ownership verification tokens." },
  { q: "What is the DNS resolution process (simplified)?", a: "Client → recursive resolver → root nameserver → TLD nameserver → authoritative nameserver → answer returned and cached along the way." },
  { q: "What is WHOIS?", a: "A protocol/service for querying a domain name or IP address to obtain registration information — registrant, registrar, creation/expiry dates, contacts, nameservers." },
  { q: "What is 'fast-flux' DNS and why do attackers use it?", a: "A technique that rapidly changes DNS A-record answers across a large pool of compromised hosts, hiding the real backend server and defeating simple IP takedowns." },
  { q: "What is 'double-flux' DNS?", a: "An extension of fast-flux where BOTH the A records and the NS records are rotated rapidly across the bot pool — far more resilient to takedown." },
  { q: "What is Dynamic DNS (DDNS) and why is it abused?", a: "A service that updates DNS records when a host's IP changes (e.g. no-ip, duckdns). Attackers abuse it to give their changing C2 infrastructure a stable domain name." },
  { q: "What is an ASN?", a: "An Autonomous System Number — a globally unique identifier for a collection of IP networks under one routing policy (e.g. an ISP)." },
  { q: "What does a 'looking glass' server let you do?", a: "Run BGP / traceroute / ping queries from a remote ISP's router to investigate routing and connectivity from a different vantage point." },
  { q: "Name three fields typically returned by a WHOIS lookup on a domain.", a: "Registrant / admin / tech contact, registrar name, creation and expiry dates, and the nameservers for the zone." },
  { q: "What is IP geolocation and what is a key caveat?", a: "Mapping an IP to a physical location using commercial/free databases. Caveat: it is approximate and easily bypassed by VPN/TOR/proxies — it indicates the routing endpoint, not the user." },
  { q: "What is a 'zone transfer' (AXFR) and why is it a concern if allowed externally?", a: "A full copy of a DNS zone sent to another server. If misconfigured to allow anyone, it leaks the entire internal hostname/IP map to attackers performing reconnaissance." }
];
let index=0, flipped=false;
function updateCard(){
  front.innerHTML=flashcards[index].q;
  back.innerHTML=flashcards[index].a;
  progress.textContent=`${index+1}/${flashcards.length}`;
  prevBtn.disabled=index===0;
  nextBtn.disabled=index===flashcards.length-1;
  card.classList.remove("flipped");
  flipped=false;
}
function flipCard(){flipped=!flipped;card.classList.toggle("flipped",flipped);}
function nextCard(){if(index<flashcards.length-1) index++;updateCard();}
function prevCard(){if(index>0) index--;updateCard();}
function toggleTheme(){document.body.classList.toggle("dark");}
updateCard();
</script>
</body>
</html>
